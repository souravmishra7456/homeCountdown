<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journey Home</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0e27;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        color: white;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
            circle at 20% 30%,
            rgba(139, 92, 246, 0.25) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(99, 102, 241, 0.25) 0%,
            transparent 30%
          ),
          radial-gradient(
            circle at 40% 80%,
            rgba(236, 72, 153, 0.15) 0%,
            transparent 30%
          );
        pointer-events: none;
        z-index: 0;
        filter: blur(60px);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
        animation: fadeInDown 0.8s ease;
      }

      .header h1 {
        font-size: clamp(2.5em, 10vw, 4em);
        background: linear-gradient(
          135deg,
          #a78bfa 0%,
          #ec4899 50%,
          #06b6d4 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 900;
        margin-bottom: 12px;
        letter-spacing: -2px;
      }

      .header p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.1em;
        font-weight: 300;
        letter-spacing: 1px;
      }

      .countdown-card {
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.1) 0%,
          rgba(99, 102, 241, 0.1) 100%
        );
        border: 2px solid rgba(167, 139, 250, 0.2);
        border-radius: 32px;
        padding: 50px 30px;
        margin-bottom: 30px;
        backdrop-filter: blur(20px);
        animation: slideInUp 0.8s ease 0.1s both;
      }

      .countdown-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .time-box {
        background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
        padding: 30px 20px;
        border-radius: 20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 20px 50px rgba(167, 139, 250, 0.2);
      }

      .time-box::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: shine 3s ease infinite;
      }

      .time-box:hover {
        transform: translateY(-8px);
        box-shadow: 0 30px 60px rgba(167, 139, 250, 0.3);
      }

      @keyframes shine {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(50%, 50%);
        }
      }

      .time-value {
        font-size: clamp(1.8em, 8vw, 3em);
        font-weight: 900;
        position: relative;
        z-index: 1;
        font-variant-numeric: tabular-nums;
      }

      .time-label {
        font-size: 0.8em;
        opacity: 0.95;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-top: 8px;
        font-weight: 600;
        position: relative;
        z-index: 1;
      }

      .progress-section {
        margin-bottom: 40px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .progress-label {
        font-size: 0.95em;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .progress-percent {
        background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 900;
        font-size: 1.1em;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid rgba(167, 139, 250, 0.2);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          #a78bfa 0%,
          #ec4899 50%,
          #06b6d4 100%
        );
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 6px;
        box-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
      }

      .motivational-box {
        background: linear-gradient(
          135deg,
          rgba(236, 72, 153, 0.15) 0%,
          rgba(6, 182, 212, 0.15) 100%
        );
        border: 2px solid rgba(236, 72, 153, 0.3);
        border-radius: 24px;
        padding: 35px;
        text-align: center;
        margin-bottom: 30px;
        animation: slideInUp 0.8s ease 0.3s both;
        backdrop-filter: blur(20px);
      }

      .motivation-emoji {
        font-size: 3em;
        margin-bottom: 16px;
      }

      .motivation-title {
        font-size: 1em;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }

      .motivation-text {
        font-size: clamp(1.1em, 4vw, 1.5em);
        line-height: 1.8;
        font-weight: 500;
        background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.1) 0%,
          rgba(6, 182, 212, 0.1) 100%
        );
        border: 2px solid rgba(99, 102, 241, 0.2);
        border-radius: 20px;
        padding: 24px;
        text-align: center;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        animation: slideInUp 0.8s ease 0.4s both;
      }

      .stat-card:hover {
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(6, 182, 212, 0.15) 100%
        );
        border-color: rgba(99, 102, 241, 0.4);
        transform: translateY(-4px);
      }

      .stat-title {
        font-size: 0.85em;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }

      .stat-number {
        font-size: clamp(2em, 6vw, 3em);
        font-weight: 900;
        background: linear-gradient(135deg, #06b6d4 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .route-section {
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.12) 0%,
          rgba(236, 72, 153, 0.12) 100%
        );
        border: 2px solid rgba(167, 139, 250, 0.25);
        border-radius: 28px;
        padding: 40px;
        margin-bottom: 30px;
        animation: slideInUp 0.8s ease 0.5s both;
        backdrop-filter: blur(20px);
      }

      .route-title {
        text-align: center;
        font-size: 0.95em;
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
        font-weight: 700;
      }

      .route-display {
        display: flex;
        align-items: center;
        justify-content: space-around;
        margin-bottom: 30px;
      }

      .airport {
        text-align: center;
        flex: 1;
      }

      .airport-emoji {
        font-size: clamp(2.5em, 8vw, 4em);
        margin-bottom: 12px;
        animation: float 3s ease-in-out infinite;
      }

      .airport-code {
        font-size: clamp(1.2em, 4vw, 1.8em);
        font-weight: 900;
        background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
      }

      .airport-name {
        font-size: 0.9em;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 600;
      }

      .flight-arrow {
        font-size: 2.5em;
        color: #ec4899;
        animation: slideRight 2s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes slideRight {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(12px);
        }
      }

      .ticket-info {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .ticket-item {
        text-align: center;
      }

      .ticket-label {
        font-size: 0.8em;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .ticket-value {
        font-size: 1.2em;
        font-weight: 800;
        color: #06b6d4;
      }

      .status-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-weight: 800;
        font-size: 0.95em;
        cursor: default;
        letter-spacing: 1px;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      }

      .day-badge {
        display: inline-block;
        background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 900;
        font-size: 0.95em;
        margin-bottom: 30px;
        animation: pulse 1s ease-in-out infinite;
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .celebration-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        backdrop-filter: blur(10px);
      }

      .celebration-box {
        text-align: center;
        max-width: 90%;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .celebration-title {
        font-size: clamp(2.5em, 12vw, 5em);
        margin-bottom: 20px;
        animation: bounce 0.8s ease 0.2s both;
      }

      .celebration-text {
        font-size: clamp(1.1em, 4vw, 1.8em);
        margin-bottom: 24px;
        color: rgba(255, 255, 255, 0.95);
        line-height: 1.6;
      }

      .celebration-route {
        font-size: 2em;
        margin: 30px 0;
        animation: slideUp 0.8s ease 0.3s both;
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5) rotateZ(-10deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotateZ(0);
          opacity: 1;
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes fadeInDown {
        from {
          transform: translateY(-40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes slideInUp {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .confetti {
        position: fixed;
        pointer-events: none;
        z-index: 1999;
      }

      @media (max-width: 1024px) {
        .container {
          max-width: 100%;
        }

        .header h1 {
          font-size: clamp(2em, 8vw, 3.5em);
        }

        .countdown-card {
          padding: 35px 25px;
        }

        .time-box {
          padding: 25px 15px;
        }

        .countdown-value {
          font-size: clamp(1.5em, 6vw, 2.5em);
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .header {
          margin-bottom: 35px;
        }

        .header h1 {
          font-size: clamp(1.8em, 7vw, 3em);
          margin-bottom: 8px;
        }

        .header p {
          font-size: 0.95em;
        }

        .countdown-card {
          padding: 28px 20px;
          margin-bottom: 25px;
          border-radius: 24px;
        }

        .countdown-grid {
          gap: 15px;
          margin-bottom: 30px;
        }

        .time-box {
          padding: 22px 12px;
          border-radius: 16px;
        }

        .countdown-value {
          font-size: clamp(1.3em, 5vw, 2.2em);
          margin-bottom: 6px;
        }

        .time-label {
          font-size: 0.75em;
        }

        .progress-section {
          margin-bottom: 30px;
        }

        .progress-bar {
          height: 10px;
        }

        .motivational-box {
          padding: 28px 22px;
          border-radius: 20px;
          margin-bottom: 25px;
        }

        .motivation-emoji {
          font-size: 2.5em;
          margin-bottom: 12px;
        }

        .motivation-title {
          font-size: 0.9em;
          margin-bottom: 10px;
        }

        .motivation-text {
          font-size: clamp(1em, 3.5vw, 1.3em);
          line-height: 1.6;
        }

        .stats-grid {
          grid-template-columns: 1fr;
          gap: 15px;
          margin-bottom: 25px;
        }

        .stat-card {
          padding: 20px;
          border-radius: 18px;
        }

        .stat-title {
          font-size: 0.8em;
          margin-bottom: 10px;
        }

        .stat-number {
          font-size: clamp(1.8em, 5vw, 2.5em);
        }

        .route-section {
          padding: 32px 22px;
          border-radius: 24px;
          margin-bottom: 25px;
        }

        .route-title {
          font-size: 0.9em;
          margin-bottom: 25px;
        }

        .route-display {
          margin-bottom: 25px;
          gap: 8px;
        }

        .airport-emoji {
          font-size: clamp(2em, 6vw, 3em);
          margin-bottom: 10px;
        }

        .airport-code {
          font-size: clamp(1em, 3.5vw, 1.5em);
          margin-bottom: 4px;
        }

        .airport-name {
          font-size: 0.8em;
        }

        .flight-arrow {
          font-size: 2em;
        }

        .ticket-info {
          padding: 18px;
          gap: 12px;
          margin-bottom: 18px;
        }

        .ticket-label {
          font-size: 0.75em;
          margin-bottom: 6px;
        }

        .ticket-value {
          font-size: 1.05em;
        }

        .status-btn {
          padding: 14px;
          font-size: 0.9em;
          border-radius: 12px;
        }

        .day-badge {
          padding: 10px 20px;
          font-size: 0.85em;
          margin-bottom: 25px;
          border-radius: 10px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .container {
          max-width: 100%;
        }

        .header {
          margin-bottom: 28px;
        }

        .header h1 {
          font-size: clamp(1.5em, 6vw, 2.5em);
          margin-bottom: 6px;
          letter-spacing: -0.5px;
        }

        .header p {
          font-size: 0.9em;
          letter-spacing: 0.5px;
        }

        .countdown-card {
          padding: 22px 16px;
          margin-bottom: 20px;
          border-radius: 20px;
        }

        .countdown-grid {
          gap: 10px;
          margin-bottom: 25px;
          grid-template-columns: repeat(2, 1fr);
        }

        .time-box {
          padding: 18px 10px;
          border-radius: 14px;
        }

        .countdown-value {
          font-size: clamp(1.1em, 5vw, 2em);
          margin-bottom: 4px;
        }

        .time-label {
          font-size: 0.65em;
          letter-spacing: 0.5px;
        }

        .progress-label {
          font-size: 0.9em;
        }

        .progress-percent {
          font-size: 1em;
        }

        .motivational-box {
          padding: 22px 18px;
          border-radius: 18px;
          margin-bottom: 20px;
        }

        .motivation-emoji {
          font-size: 2.2em;
          margin-bottom: 10px;
        }

        .motivation-title {
          font-size: 0.85em;
          margin-bottom: 8px;
          letter-spacing: 0.5px;
        }

        .motivation-text {
          font-size: clamp(0.95em, 3.5vw, 1.15em);
          line-height: 1.5;
        }

        .stats-grid {
          gap: 12px;
          margin-bottom: 20px;
        }

        .stat-card {
          padding: 18px 14px;
          border-radius: 16px;
        }

        .stat-title {
          font-size: 0.75em;
          margin-bottom: 8px;
        }

        .stat-number {
          font-size: clamp(1.6em, 5vw, 2.2em);
        }

        .route-section {
          padding: 24px 18px;
          border-radius: 20px;
          margin-bottom: 20px;
        }

        .route-title {
          font-size: 0.85em;
          margin-bottom: 20px;
          letter-spacing: 1px;
        }

        .route-display {
          margin-bottom: 20px;
          gap: 6px;
        }

        .airport {
          flex: 1;
        }

        .airport-emoji {
          font-size: clamp(1.8em, 5vw, 2.8em);
          margin-bottom: 8px;
        }

        .airport-code {
          font-size: clamp(0.9em, 3vw, 1.3em);
          margin-bottom: 3px;
        }

        .airport-name {
          font-size: 0.75em;
        }

        .flight-arrow {
          font-size: 1.6em;
        }

        .ticket-info {
          padding: 16px;
          grid-template-columns: 1fr;
          gap: 12px;
          margin-bottom: 16px;
        }

        .ticket-label {
          font-size: 0.7em;
          margin-bottom: 5px;
        }

        .ticket-value {
          font-size: 1em;
        }

        .status-btn {
          padding: 12px;
          font-size: 0.85em;
          border-radius: 10px;
        }

        .day-badge {
          padding: 8px 16px;
          font-size: 0.8em;
          margin-bottom: 20px;
          border-radius: 8px;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 10px;
        }

        .header h1 {
          font-size: clamp(1.3em, 5vw, 2em);
          margin-bottom: 5px;
        }

        .header p {
          font-size: 0.85em;
        }

        .countdown-card {
          padding: 18px 12px;
          margin-bottom: 18px;
        }

        .countdown-grid {
          gap: 8px;
          margin-bottom: 20px;
        }

        .time-box {
          padding: 14px 8px;
          border-radius: 12px;
        }

        .countdown-value {
          font-size: clamp(1em, 4vw, 1.8em);
        }

        .motivational-box {
          padding: 18px 14px;
          border-radius: 16px;
          margin-bottom: 18px;
        }

        .motivation-emoji {
          font-size: 2em;
          margin-bottom: 8px;
        }

        .motivation-title {
          font-size: 0.75em;
        }

        .motivation-text {
          font-size: clamp(0.9em, 3vw, 1.05em);
        }

        .stats-grid {
          gap: 10px;
          margin-bottom: 18px;
        }

        .stat-card {
          padding: 14px 10px;
        }

        .stat-title {
          font-size: 0.7em;
        }

        .stat-number {
          font-size: clamp(1.4em, 4vw, 2em);
        }

        .route-section {
          padding: 20px 14px;
          margin-bottom: 18px;
        }

        .ticket-info {
          padding: 14px;
          gap: 10px;
          margin-bottom: 14px;
        }

        .day-badge {
          padding: 7px 14px;
          font-size: 0.75em;
        }

        .celebration-title {
          font-size: clamp(2em, 10vw, 3.5em);
        }

        .celebration-text {
          font-size: clamp(1em, 3vw, 1.4em);
        }

        .celebration-route {
          font-size: 1.5em;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>✈️ JOURNEY HOME</h1>
        <p>Your Adventure Awaits</p>
      </div>

      <div class="countdown-card">
        <div class="countdown-grid">
          <div class="time-box">
            <div class="time-value" id="days">0</div>
            <div class="time-label">Days</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Hours</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Minutes</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="seconds">00</div>
            <div class="time-label">Seconds</div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-header">
            <span class="progress-label">Journey Progress</span>
            <span class="progress-percent"
              ><span id="percentage">0</span>%</span
            >
          </div>
          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progressFill"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>

      <div id="badgeContainer"></div>

      <div class="motivational-box">
        <div class="motivation-emoji" id="motivationEmoji">📍</div>
        <div class="motivation-title" id="motivationTitle">Loading...</div>
        <div class="motivation-text" id="motivationText">
          Get ready for an amazing journey!
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Days Passed</div>
          <div class="stat-number" id="daysPassed">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Days Left</div>
          <div class="stat-number" id="daysLeft">5</div>
        </div>
      </div>

      <div class="route-section">
        <div class="route-title">✈️ Your Route</div>
        <div class="route-display">
          <div class="airport">
            <div class="airport-emoji">🏙️</div>
            <div class="airport-code">RNC</div>
            <div class="airport-name">Ranchi</div>
          </div>
          <div class="flight-arrow">→</div>
          <div class="airport">
            <div class="airport-emoji">🏖️</div>
            <div class="airport-code">BBS</div>
            <div class="airport-name">Bhubaneswar</div>
          </div>
        </div>

        <div class="ticket-info">
          <div class="ticket-item">
            <div class="ticket-label">📅 Departure Date</div>
            <div class="ticket-value">09 JAN 2026</div>
          </div>
          <div class="ticket-item">
            <div class="ticket-label">🕒 Departure Time</div>
            <div class="ticket-value">20:10</div>
          </div>
        </div>

        <button class="status-btn">✓ CONFIRMED - READY TO TRAVEL</button>
      </div>
    </div>

    <script>
      const targetDate = new Date("2026-01-09T20:10:00").getTime();
      const startDate = new Date("2026-01-04T21:00:00").getTime();
      const totalDuration = targetDate - startDate;

      const messages = [
        {
          emoji: "📍",
          title: "Day 1: The Journey Begins",
          text: "You're just getting started. Get ready for an amazing adventure!",
        },
        {
          emoji: "🌱",
          title: "Day 2: Building Momentum",
          text: "Every moment brings you closer! Keep pushing forward.",
        },
        {
          emoji: "🎯",
          title: "Day 3: Halfway There",
          text: "Amazing progress! The finish line is getting closer.",
        },
        {
          emoji: "💫",
          title: "Day 4: Almost There!",
          text: "The final stretch! Your journey home is right around the corner!",
        },
        {
          emoji: "🎉",
          title: "Day 5: THE FINAL DAY",
          text: "Home is calling! This is it—your adventure begins TODAY! 🌟",
        },
      ];

      function getMessageForDay(dayIndex) {
        return messages[Math.min(Math.max(dayIndex, 0), messages.length - 1)];
      }

      function createConfetti() {
        const emojis = ["🎉", "✨", "🎊", "🌟", "💫"];
        for (let i = 0; i < 60; i++) {
          const confetti = document.createElement("div");
          confetti.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];
          confetti.className = "confetti";
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.top = "-30px";
          confetti.style.fontSize = Math.random() * 40 + 20 + "px";
          confetti.style.animation = `fall ${
            Math.random() * 2 + 2
          }s linear forwards`;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3500);
        }
      }

      const keyframes = document.createElement("style");
      keyframes.textContent = `
        @keyframes fall {
          to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
      `;
      document.head.appendChild(keyframes);

      function showCelebration() {
        const overlay = document.createElement("div");
        overlay.className = "celebration-overlay";
        overlay.innerHTML = `
          <div class="celebration-box">
            <div class="celebration-title">🎉 JOURNEY BEGINS! 🎉</div>
            <div class="celebration-text">The countdown is complete!</div>
            <div class="celebration-route">🏙️ Ranchi → 🏖️ Bhubaneswar</div>
            <div class="celebration-text">
              Happy Journey! 🌟<br>
              <span style="font-size: 0.9em; color: rgba(255, 255, 255, 0.8);">Safe travels and wonderful memories await you!</span>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);

        for (let i = 0; i < 8; i++) {
          setTimeout(createConfetti, i * 150);
        }
      }

      function updateCountdown() {
        const now = new Date().getTime();
        const remaining = targetDate - now;

        if (remaining < 0) {
          if (!document.querySelector(".celebration-overlay")) {
            showCelebration();
          }
          document.getElementById("days").textContent = "0";
          document.getElementById("hours").textContent = "00";
          document.getElementById("minutes").textContent = "00";
          document.getElementById("seconds").textContent = "00";
          document.getElementById("percentage").textContent = "100";
          document.getElementById("progressFill").style.width = "100%";
          return;
        }

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor(
          (remaining % (1000 * 60 * 60)) / (1000 * 60)
        );
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0"
        );
        document.getElementById("minutes").textContent = String(
          minutes
        ).padStart(2, "0");
        document.getElementById("seconds").textContent = String(
          seconds
        ).padStart(2, "0");

        const elapsed = now - startDate;
        const percent = Math.min(
          Math.round((elapsed / totalDuration) * 100),
          99
        );
        document.getElementById("percentage").textContent = percent;
        document.getElementById("progressFill").style.width = percent + "%";

        const daysPassed = Math.floor(elapsed / (1000 * 60 * 60 * 24));
        document.getElementById("daysPassed").textContent = daysPassed;
        document.getElementById("daysLeft").textContent = days;

        const msg = getMessageForDay(daysPassed);
        document.getElementById("motivationEmoji").textContent = msg.emoji;
        document.getElementById("motivationTitle").textContent = msg.title;
        document.getElementById("motivationText").textContent = msg.text;

        const badgeContainer = document.getElementById("badgeContainer");
        if (days === 0) {
          if (!badgeContainer.querySelector(".day-badge")) {
            const badge = document.createElement("div");
            badge.className = "day-badge";
            badge.textContent = "🎊 TODAY IS THE DAY! 🎊";
            badgeContainer.appendChild(badge);
          }
        } else {
          const badge = badgeContainer.querySelector(".day-badge");
          if (badge) badge.remove();
        }
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
