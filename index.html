<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journey Home</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8f9fa;
        --bg-tertiary: #f0f1f3;
        --text-primary: #1a1a1a;
        --text-secondary: #666666;
        --text-tertiary: #999999;
        --border-color: #e0e0e0;
        --accent-1: #6366f1;
        --accent-2: #ec4899;
        --accent-3: #10b981;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-tertiary: #94a3b8;
        --border-color: #475569;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: background 0.3s ease, color 0.3s ease;
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        position: relative;
        text-align: center;
        margin-bottom: 40px;
      }

      .header-content h1 {
        font-size: clamp(2em, 6vw, 3.5em);
        background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .header-content p {
        color: var(--text-secondary);
        font-size: 1.05em;
        font-weight: 500;
      }

      .theme-toggle {
        position: absolute;
        top: 0;
        right: 0;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 1.2em;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-toggle:hover {
        background: var(--bg-tertiary);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .countdown-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px 30px;
        margin-bottom: 30px;
        box-shadow: var(--shadow);
      }

      .countdown-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 16px;
        margin-bottom: 35px;
      }

      .time-box {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        padding: 28px 20px;
        border-radius: 16px;
        text-align: center;
        color: white;
        box-shadow: var(--shadow);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .time-box:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
      }

      .time-value {
        font-size: clamp(2em, 7vw, 2.8em);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .time-label {
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 8px;
        font-weight: 600;
        opacity: 0.95;
      }

      .progress-section {
        margin-bottom: 30px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .progress-label {
        font-weight: 600;
        color: var(--text-primary);
      }

      .progress-percent {
        font-weight: 700;
        color: #ec4899;
        font-size: 1.1em;
      }

      .progress-bar {
        width: 100%;
        height: 14px;
        background: var(--bg-tertiary);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #6366f1 0%, #ec4899 100%);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 8px;
      }

      #badgeContainer {
        margin-bottom: 30px;
        text-align: center;
      }

      .day-badge {
        display: inline-block;
        background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        color: white;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.95em;
        box-shadow: var(--shadow-lg);
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .motivation-box {
        background: linear-gradient(
          135deg,
          var(--bg-secondary) 0%,
          var(--bg-tertiary) 100%
        );
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px 30px;
        text-align: center;
        margin-bottom: 30px;
        box-shadow: var(--shadow);
      }

      .motivation-emoji {
        font-size: 3.5em;
        margin-bottom: 16px;
      }

      .motivation-title {
        font-size: 1.1em;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .motivation-text {
        font-size: clamp(1.1em, 4vw, 1.6em);
        line-height: 1.7;
        font-weight: 500;
        background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 28px;
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: var(--shadow);
      }

      .stat-card:hover {
        border-color: #6366f1;
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }

      .stat-title {
        font-size: 0.85em;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .stat-number {
        font-size: clamp(2.2em, 8vw, 3em);
        font-weight: 900;
        background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .route-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: var(--shadow);
      }

      .route-title {
        text-align: center;
        font-size: 0.95em;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 35px;
        font-weight: 700;
      }

      .route-display {
        display: flex;
        align-items: center;
        justify-content: space-around;
        margin-bottom: 35px;
        gap: 20px;
      }

      .airport {
        text-align: center;
        flex: 1;
      }

      .airport-emoji {
        font-size: clamp(2.5em, 8vw, 4em);
        margin-bottom: 12px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      .airport-code {
        font-size: clamp(1.2em, 4vw, 1.8em);
        font-weight: 900;
        background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
      }

      .airport-name {
        font-size: 0.95em;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .flight-arrow {
        font-size: 2.2em;
        color: #ec4899;
        animation: slideRight 2s ease-in-out infinite;
      }

      @keyframes slideRight {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(12px);
        }
      }

      .ticket-info {
        background: var(--bg-tertiary);
        border-radius: 14px;
        padding: 24px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 24px;
        border: 1px solid var(--border-color);
      }

      .ticket-item {
        text-align: center;
      }

      .ticket-label {
        font-size: 0.8em;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .ticket-value {
        font-size: 1.3em;
        font-weight: 800;
        color: #6366f1;
      }

      .status-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 800;
        font-size: 0.95em;
        cursor: default;
        letter-spacing: 1px;
        box-shadow: var(--shadow-lg);
      }

      .celebration-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        backdrop-filter: blur(8px);
      }

      .celebration-box {
        text-align: center;
        max-width: 90%;
        color: white;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .celebration-title {
        font-size: clamp(2.5em, 12vw, 5em);
        margin-bottom: 20px;
        animation: bounce 0.8s ease 0.2s both;
      }

      .celebration-text {
        font-size: clamp(1.1em, 4vw, 1.8em);
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .celebration-route {
        font-size: 2em;
        margin: 30px 0;
        animation: slideUp 0.8s ease 0.3s both;
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5) rotateZ(-10deg);
          opacity: 0;
        }
        100% {
          transform: scale(1) rotateZ(0);
          opacity: 1;
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .confetti {
        position: fixed;
        pointer-events: none;
        z-index: 1999;
      }

      @media (max-width: 768px) {
        .header {
          margin-bottom: 30px;
        }

        .header-content h1 {
          font-size: 2em;
        }

        .countdown-grid {
          gap: 12px;
          margin-bottom: 25px;
        }

        .time-box {
          padding: 22px 16px;
        }

        .motivation-box {
          padding: 28px 20px;
        }

        .motivation-emoji {
          font-size: 2.8em;
        }

        .stats-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .route-section {
          padding: 28px 20px;
        }

        .ticket-info {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 20px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .header {
          margin-bottom: 24px;
          gap: 12px;
        }

        .header-content {
          flex: 1 1 100%;
        }

        .header-content h1 {
          font-size: 1.6em;
        }

        .countdown-section {
          padding: 20px 16px;
          margin-bottom: 20px;
        }

        .countdown-grid {
          gap: 10px;
          margin-bottom: 20px;
          grid-template-columns: repeat(2, 1fr);
        }

        .time-box {
          padding: 18px 12px;
        }

        .time-value {
          font-size: 1.8em;
        }

        .motivation-box {
          padding: 20px 16px;
          margin-bottom: 20px;
        }

        .motivation-emoji {
          font-size: 2.2em;
          margin-bottom: 12px;
        }

        .motivation-title {
          font-size: 0.95em;
          margin-bottom: 10px;
        }

        .motivation-text {
          font-size: 1.05em;
        }

        .stat-card {
          padding: 20px;
        }

        .route-section {
          padding: 20px 16px;
        }

        .route-display {
          gap: 12px;
          margin-bottom: 25px;
        }

        .flight-arrow {
          font-size: 1.6em;
        }

        .ticket-info {
          padding: 16px;
          gap: 12px;
        }

        .theme-toggle {
          padding: 8px 12px;
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-content">
          <h1>✈️ JOURNEY HOME</h1>
          <p>Your Adventure Awaits</p>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </div>

      <div id="badgeContainer"></div>

      <div class="countdown-section">
        <div class="countdown-grid">
          <div class="time-box">
            <div class="time-value" id="days">0</div>
            <div class="time-label">Days</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Hours</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Minutes</div>
          </div>
          <div class="time-box">
            <div class="time-value" id="seconds">00</div>
            <div class="time-label">Seconds</div>
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-header">
            <span class="progress-label">Journey Progress</span>
            <span class="progress-percent"
              ><span id="percentage">0</span>%</span
            >
          </div>
          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progressFill"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>

      <div id="badgeContainer"></div>

      <div class="motivation-box">
        <div class="motivation-emoji" id="motivationEmoji">📍</div>
        <div class="motivation-title" id="motivationTitle">Loading...</div>
        <div class="motivation-text" id="motivationText">
          Get ready for an amazing journey!
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Days Passed</div>
          <div class="stat-number" id="daysPassed">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Days Left</div>
          <div class="stat-number" id="daysLeft">5</div>
        </div>
      </div>

      <div class="route-section">
        <div class="route-title">✈️ Your Route</div>
        <div class="route-display">
          <div class="airport">
            <div class="airport-emoji">🏙️</div>
            <div class="airport-code">RNC</div>
            <div class="airport-name">Ranchi</div>
          </div>
          <div class="flight-arrow">→</div>
          <div class="airport">
            <div class="airport-emoji">🏖️</div>
            <div class="airport-code">BBS</div>
            <div class="airport-name">Bhubaneswar</div>
          </div>
        </div>

        <div class="ticket-info">
          <div class="ticket-item">
            <div class="ticket-label">📅 Departure</div>
            <div class="ticket-value">09 JAN 2026</div>
          </div>
          <div class="ticket-item">
            <div class="ticket-label">🕒 Time</div>
            <div class="ticket-value">20:10</div>
          </div>
        </div>

        <button class="status-btn">✓ CONFIRMED - READY TO TRAVEL</button>
      </div>
    </div>

    <script>
      // Auto-detect system theme and allow toggle
      const themeToggle = document.getElementById("themeToggle");
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      const savedTheme =
        localStorage.getItem("theme") || (prefersDark ? "dark" : "light");

      document.documentElement.setAttribute("data-theme", savedTheme);
      themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";

      themeToggle.addEventListener("click", () => {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        themeToggle.textContent = newTheme === "dark" ? "☀️" : "🌙";
        localStorage.setItem("theme", newTheme);
      });

      const targetDate = new Date("2026-01-09T19:45:00").getTime();
      const startDate = new Date("2026-01-04T21:00:00").getTime();
      const totalDuration = targetDate - startDate;

      const messages = [
        {
          emoji: "📍",
          title: "Day 1: The Journey Begins",
          text: "You're just getting started. Get ready for an amazing adventure!",
        },
        {
          emoji: "🌱",
          title: "Day 2: Building Momentum",
          text: "Every moment brings you closer! Keep pushing forward.",
        },
        {
          emoji: "🎯",
          title: "Day 3: Halfway There",
          text: "Amazing progress! The finish line is getting closer.",
        },
        {
          emoji: "💫",
          title: "Day 4: Almost There!",
          text: "The final stretch! Your journey home is right around the corner!",
        },
        {
          emoji: "🎉",
          title: "Day 5: THE FINAL DAY",
          text: "Home is calling! This is it—your adventure begins TODAY! 🌟",
        },
      ];

      function getMessageForDay(dayIndex) {
        return messages[Math.min(Math.max(dayIndex, 0), messages.length - 1)];
      }

      function createConfetti() {
        const emojis = ["🎉", "✨", "🎊", "🌟", "💫"];
        for (let i = 0; i < 60; i++) {
          const confetti = document.createElement("div");
          confetti.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];
          confetti.className = "confetti";
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.top = "-30px";
          confetti.style.fontSize = Math.random() * 40 + 20 + "px";
          confetti.style.animation = `fall ${
            Math.random() * 2 + 2
          }s linear forwards`;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3500);
        }
      }

      const keyframes = document.createElement("style");
      keyframes.textContent = `@keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }`;
      document.head.appendChild(keyframes);

      function showCelebration() {
        const overlay = document.createElement("div");
        overlay.className = "celebration-overlay";
        overlay.innerHTML = `
                <div class="celebration-box">
                    <div class="celebration-title">🎉 JOURNEY BEGINS! 🎉</div>
                    <div class="celebration-text">The countdown is complete!</div>
                    <div class="celebration-route">🏙️ Ranchi → 🏖️ Bhubaneswar</div>
                    <div class="celebration-text">Happy Journey! 🌟<br><span style="font-size: 0.9em; opacity: 0.9;">Safe travels and wonderful memories await you!</span></div>
                </div>
            `;
        document.body.appendChild(overlay);

        for (let i = 0; i < 8; i++) {
          setTimeout(createConfetti, i * 150);
        }
      }

      function updateCountdown() {
        const now = new Date().getTime();
        const remaining = targetDate - now;

        if (remaining < 0) {
          if (!document.querySelector(".celebration-overlay")) {
            showCelebration();
          }
          document.getElementById("days").textContent = "0";
          document.getElementById("hours").textContent = "00";
          document.getElementById("minutes").textContent = "00";
          document.getElementById("seconds").textContent = "00";
          document.getElementById("percentage").textContent = "100";
          document.getElementById("progressFill").style.width = "100%";
          return;
        }

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor(
          (remaining % (1000 * 60 * 60)) / (1000 * 60)
        );
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0"
        );
        document.getElementById("minutes").textContent = String(
          minutes
        ).padStart(2, "0");
        document.getElementById("seconds").textContent = String(
          seconds
        ).padStart(2, "0");

        const elapsed = now - startDate;
        const percent = Math.min(
          Math.round((elapsed / totalDuration) * 100),
          99
        );
        document.getElementById("percentage").textContent = percent;
        document.getElementById("progressFill").style.width = percent + "%";

        const daysPassed = Math.floor(elapsed / (1000 * 60 * 60 * 24));
        document.getElementById("daysPassed").textContent = daysPassed;
        document.getElementById("daysLeft").textContent = days;

        const msg = getMessageForDay(daysPassed);
        document.getElementById("motivationEmoji").textContent = msg.emoji;
        document.getElementById("motivationTitle").textContent = msg.title;
        document.getElementById("motivationText").textContent = msg.text;

        const badgeContainer = document.getElementById("badgeContainer");
        if (days === 0) {
          if (!badgeContainer.querySelector(".day-badge")) {
            const badge = document.createElement("div");
            badge.className = "day-badge";
            badge.textContent = "🎊 TODAY IS THE DAY! 🎊";
            badgeContainer.appendChild(badge);
          }
        } else {
          const badge = badgeContainer.querySelector(".day-badge");
          if (badge) badge.remove();
        }
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
